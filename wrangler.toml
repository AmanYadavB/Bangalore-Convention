name = "bangalore-convention"
main = "worker.js"
compatibility_date = "2024-11-01"

# Serve the static site (public/) through the ASSETS binding.
[assets]
directory = "./public"
binding = "ASSETS"

# KV storage for registrations and expenses.
# Replace PASTE_YOUR_KV_NAMESPACE_ID_HERE with the ID of the KV namespace you create.
[[kv_namespaces]]
binding = "CONVENTION_KV"
id = "523334e302664ae8a883e5a0c44119a0"

# D1 database stores developer-generated pages (the AI agent writes here).
# Create it once:  npx wrangler d1 create convention-db
# then paste the printed database_id below.
[[d1_databases]]
binding = "CONVENTION_DB"
database_name = "convention-db"
database_id = "60bc0f91-4595-478b-a576-1841ebb41588"

# Cloudflare Workers AI powers the chat assistant (env.AI).
[ai]
binding = "AI"

# Ops dashboard emails: one cron ticks every 10 minutes and the Worker decides
# what's due — the daily digest at DIGEST_TIME_IST (set below, plain IST time,
# no UTC math), and the critical-only check every 6 hours.
[triggers]
crons = ["*/10 * * * *"]

# Developer-role gate. Only requests carrying this exact key may create,
# edit or delete pages through the agent. CHANGE THIS before deploying, and
# prefer setting it as a secret:  npx wrangler secret put DEV_KEY
[vars]
DEV_KEY = "amankumaryadavasasmd"
MAILCHANNELS_API_KEY = "uqrnax8EQ8hveVhcTZTKjkFAdl9Q6iQb"
RAZORPAY_KEY_ID = "rzp_test_TIK9lJop7jGPPi"
RAZORPAY_KEY_SECRET = "0aYSxQjaJf95wOOczK5k1fLm"
DEEPGRAM_API_KEY = "60167b8e4cf80a81095ba76f3e465283b507fd03"

# Where the ops dashboard emails go. CHANGE THIS to your Gmail address.
DASHBOARD_EMAIL = "amankumaryadavasasmd@gmail.com"
# Daily digest time in IST (24h "HH:MM"). Can also be changed live without a
# redeploy:  POST /api/report/schedule  {"devKey":"...","time":"18:40"}
DIGEST_TIME_IST = "17:00"
# Critical alert fires when Deepgram credit drops below this many dollars.
ALERT_DEEPGRAM_MIN = "2"
# Deepgram's starting free credit in dollars — used to compute the "credit
# used %" bar in the digest (new accounts get $200).
DEEPGRAM_CREDIT_TOTAL = "200"
# The main DEEPGRAM_API_KEY can speak but may lack permission to read the
# account balance (403). To show "dollars remaining", create a key with
# Owner/Administrator scope in the Deepgram console and paste it here:
DEEPGRAM_BALANCE_KEY = "c6e0cd2a8d85b8fbe794c8bd7813cc46d04cee38"
# Optional — enables the "Cloudflare requests (24h)" row in the digest:
#   CF_ACCOUNT_ID  = your account id (dash.cloudflare.com → Workers → right sidebar)
#   CF_API_TOKEN   = create an API token with "Account Analytics: Read", then run
#                    npx wrangler secret put CF_API_TOKEN
CF_ACCOUNT_ID = "8d7633c4e9136784b6f1f567c35728ad"

# ---- WhatsApp Cloud API ----
# The "Phone number ID" from the API Setup page. Not a secret - it is useless
# without the token, which must NOT go here. Set the three secrets with:
#   npx wrangler secret put WHATSAPP_TOKEN         (permanent system-user token)
#   npx wrangler secret put WHATSAPP_VERIFY_TOKEN  (any random string you invent)
#   npx wrangler secret put WHATSAPP_APP_SECRET    (App Settings -> Basic -> App secret)
WHATSAPP_PHONE_ID = "1168920729645898"
# Must match the language you picked when creating the template ("en" vs "en_US").
WHATSAPP_TEMPLATE_LANG = "en"
# Public WhatsApp Channel for the daily reflections. Paste the "Share link" from
# the channel (WhatsApp -> Updates -> your channel -> Channel info -> Share link).
# Until this is set, the follow button on reflections.html stays hidden.
WHATSAPP_CHANNEL_URL = "https://whatsapp.com/channel/0029VbDRqVyJkK77DOFXs00o"

# ---- Daily reflection broadcast (paid: Marketing template, ~Rs 0.80/message) ----
# Comma-separated numbers, any format - "+91 98765 43210", "09876543210" and
# "919876543210" all normalise the same way. Leave EMPTY to disable the
# broadcast entirely; the free WhatsApp Channel above is unaffected either way.
# While on the Meta test number, only your 5 verified test recipients can receive.
REFLECTION_RECIPIENTS = "919625018330"
# When the broadcast goes out, IST 24h "HH:MM". The 10-minute cron means the
# real send lands within 10 minutes after this.
REFLECTION_TIME_IST = "07:00"
# Must match the daily_reflection template EXACTLY as approved:
#   "image" -> the template has a Media/Image header (send one every time)
#   "none"  -> the template is body-only (never send a header)
# Getting this wrong fails every send with a parameter mismatch.
REFLECTION_TEMPLATE_HEADER = "image"
# Public origin of this site. Used to build the template header image URL from
# the cron, where there is no incoming request to read an origin from.
SITE_ORIGIN = "https://biaac.com"