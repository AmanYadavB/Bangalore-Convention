name = "bangalore-convention-api"
main = "./cloudflare/worker.js"
compatibility_date = "2026-07-23"

# Set your Cloudflare account id here (find it in Dashboard -> Overview)
# Replace YOUR_ACCOUNT_ID with the actual account id before using wrangler publish
account_id = "YOUR_ACCOUNT_ID"

# KV namespace bindings: provide the namespace IDs you created in the dashboard
# Replace the placeholders with the actual Namespace IDs copied from the Cloudflare UI
kv_namespaces = [
  { binding = "REGISTRATIONS", id = "PASTE_REGISTRATIONS_NAMESPACE_ID_HERE" },
  { binding = "EXPENSES",      id = "PASTE_EXPENSES_NAMESPACE_ID_HERE" }
]

[env.production]
# Do NOT put secrets here. Use the Cloudflare Dashboard or `wrangler secret put` to set secrets.
# Example secrets to add (via Dashboard or wrangler):
# ADMIN_TOKEN  -> a long random string used by admin endpoints
# PRICES       -> optional JSON string to override default prices, e.g. '{"without_stay":5000,"stay_single":8000,"stay_double":7000,"stay_triple":6500}'
