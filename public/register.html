<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register · Bangalore Convention</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- L2 veil: EVERY page load starts covered from the first paint, so an
         empty layout is never visible - not on cold entry, not on reload,
         not when clicking between pages. It lifts when the page is ready
         (data pages hand it to html.data-wait until their fetches land),
         with a 350ms minimum so it never blinks and a 900ms cap so the veil
         itself never becomes the lag. The lift cues the entrance
         animations (see mountReveals). -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("veiling");
        var lifted = false;
        var t0 = Date.now();
        window.__liftVeil = function () {
          if (lifted) return;
          lifted = true;
          var go = function () {
            // A page still fetching keeps the same cover (html.data-wait);
            // its pageLoading(false) will do the fade instead.
            if (d.classList.contains("data-wait") || window.__bcDataWait) {
              d.classList.remove("veiling");
              d.classList.add("data-wait");
              return;
            }
            d.classList.add("veil-up");
            document.dispatchEvent(new CustomEvent("bc:veil-up"));
            setTimeout(function () { d.classList.remove("veiling", "veil-up"); }, 460);
          };
          var hold = 350 - (Date.now() - t0);
          if (hold > 0) setTimeout(go, hold);
          else go();
        };
        setTimeout(window.__liftVeil, 900);
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  </head>
  <body>
    <div id="nav"></div>

    <div class="container">
      <h1 class="page-title">Register for the Convention</h1>
      <p class="page-sub">Three quick steps — your ticket builds itself as you go.</p>

      <div id="reg-layout" class="reg-wizard">
        <div class="ticket-col">
          <div class="ticket" id="ticket"></div>
          <p class="tk-hint">every step stamps the ticket</p>
        </div>
        <div class="wiz-col">
          <div class="mini-ticket" id="miniTicket"></div>
          <div class="reg-steps" id="regSteps"></div>
          <div class="card wiz-stage" id="wizStage"><div class="bc-loading" role="status" aria-label="Loading"><span class="bc-load-mark">B<i>·</i>I<i>·</i>A<i>·</i>A<i>·</i>C</span></div></div>
        </div>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script>
      mountNav("register");

      // ---- The Ticket Wizard: 3 steps, each stamping the live ticket ----
      const CAT_ICONS = ["🚪", "👥", "👨‍👩‍👦", "🎟️", "🌅", "🌞", "🌇"];
      const CAT_GRADS = [
        "linear-gradient(140deg,#22d3ee,#3b82f6)",
        "linear-gradient(140deg,#818cf8,#c084fc)",
        "linear-gradient(140deg,#fb7185,#f59e0b)",
        "linear-gradient(140deg,#f59e0b,#ef4444)",
        "linear-gradient(140deg,#38bdf8,#5b5bf0)",
        "linear-gradient(140deg,#a78bfa,#7c3aed)",
        "linear-gradient(140deg,#34d399,#0ea5e9)",
      ];
      const STEP_NAMES = ["Category", "Your details", "Ticket & pay"];

      let PRICING = [];
      const state = {
        step: 0,
        sel: null, // index into PRICING
        name: "", email: "", phone: "", city: "", gender: "", notes: "",
      };

      const root = document.getElementById("reg-layout");
      const stepsEl = document.getElementById("regSteps");
      const stageEl = document.getElementById("wizStage");
      const ticketEl = document.getElementById("ticket");
      const miniEl = document.getElementById("miniTicket");

      const cat = () => (state.sel === null ? null : PRICING[state.sel]);
      const ico = (i) => CAT_ICONS[i % CAT_ICONS.length];
      const grad = (i) => CAT_GRADS[i % CAT_GRADS.length];
      // A category with a real photo (RG Royal Hotel room/venue shots) shows
      // that instead of the icon+gradient placeholder.
      const bandStyle = (c, i) =>
        c && c.image
          ? `background-image:url(${c.image});background-size:cover;background-position:center`
          : `background:${grad(i)}`;
      const bandFace = (c, i) => (c && c.image ? "" : ico(i));

      function paintSteps() {
        stepsEl.innerHTML = STEP_NAMES.map(
          (s, i) =>
            `<span class="reg-stp${i === state.step ? " on" : i < state.step ? " done" : ""}"><i>${
              i < state.step ? "✓" : i + 1
            }</i> ${s}</span>` + (i < STEP_NAMES.length - 1 ? '<span class="reg-ln"></span>' : "")
        ).join("");
      }

      function paintTicket(retum) {
        const c = cat();
        const band = c ? bandStyle(c, state.sel) : "background:linear-gradient(140deg,#94a3b8,#64748b)";
        const face = c ? bandFace(c, state.sel) : "🎟️";
        ticketEl.innerHTML =
          `<div class="tk-band" style="${band}">${face}</div>` +
          `<div class="tk-body"><span class="tk-kicker">Bangalore Convention · 09–11 July 2027</span>` +
          `<div class="tk-name">${
            state.name ? escapeHtml(state.name) : '<span class="tk-phname">Your name here</span>'
          }</div>` +
          `<div class="tk-meta"><span>${
            c ? escapeHtml(c.name) + " · " + escapeHtml(c.description || "") : "pick a category to begin"
          }</span><b>${c ? money(c.price) : "—"}</b></div>` +
          `<div class="tk-perf"></div></div>` +
          `<div class="tk-stub"><span class="tk-code">BC-PREVIEW</span><span class="tk-bars">${Array.from(
            { length: 22 },
            (_, i) => `<i style="height:${5 + ((i * 7) % 12)}px"></i>`
          ).join("")}</span></div>`;
        miniEl.innerHTML =
          `<span class="mt-ico" style="${band}">${face}</span>` +
          `<span class="mt-txt"><span class="mt-name">${
            state.name ? escapeHtml(state.name) : "Your ticket"
          }</span><br><span class="mt-cat">${c ? escapeHtml(c.name) : "pick a category"}</span></span>` +
          `<span class="mt-amt">${c ? money(c.price) : "—"}</span>`;
        if (retum) {
          [ticketEl, miniEl].forEach((el) => {
            el.classList.remove("retum");
            void el.offsetWidth;
            el.classList.add("retum");
          });
        }
      }

      function field(id, label, extra) {
        return (
          `<span style="display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:12px 0 5px">${label}</span>` +
          `<input id="${id}" class="wiz-inp" style="width:100%" ${extra || ""} />`
        );
      }

      function paintStage() {
        stageEl.innerHTML = "";
        const d = document.createElement("div");

        if (state.step === 0) {
          d.innerHTML =
            `<div class="cat-choice">` +
            PRICING.map(
              (c, i) =>
                `<button class="catcard${state.sel === i ? " sel" : ""}" data-i="${i}" type="button">` +
                `<span class="cat-ph" style="${bandStyle(c, i)}">${bandFace(c, i)}</span>` +
                `<span class="cat-nm">${escapeHtml(c.name)}</span><span class="cat-pr">${money(c.price)}</span></button>`
            ).join("") +
            `</div>`;
          d.querySelectorAll(".catcard").forEach((b) =>
            b.addEventListener("click", () => {
              state.sel = +b.dataset.i;
              go(1);
            })
          );
        } else if (state.step === 1) {
          d.innerHTML =
            field("wName", "FULL NAME *", `placeholder="Your name" required autocomplete="name"`) +
            field("wEmail", "EMAIL *", `type="email" placeholder="you@email.com" required autocomplete="email"`) +
            field(
              "wPhone",
              "PHONE *",
              `type="tel" inputmode="numeric" pattern="[0-9]{10}" maxlength="10" title="10 digits, no spaces or +91" placeholder="10-digit number" required autocomplete="tel"`
            ) +
            field("wCity", "CITY", `placeholder="e.g. Bangalore"`) +
            `<span style="display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:12px 0 5px">GENDER</span>` +
            `<select id="wGender" style="width:100%"><option value="">Prefer not to say</option><option>Male</option><option>Female</option><option>Other</option></select>` +
            `<span style="display:block;font-size:11.5px;font-weight:700;color:var(--muted);margin:12px 0 5px">NOTES (DIETARY, ACCESSIBILITY, ETC.)</span>` +
            `<textarea id="wNotes" style="width:100%" placeholder="Anything we should know?"></textarea>` +
            `<div class="wiz-nav"><button class="btn ghost" id="wBack" type="button">← Category</button><button class="btn primary" id="wNext" type="button">See my ticket →</button></div>`;

          // restore + track values so hopping between steps loses nothing
          const bind = (id, key, tumbleName) => {
            const el = d.querySelector("#" + id);
            el.value = state[key];
            el.addEventListener("input", () => {
              state[key] = el.value.trim();
              if (tumbleName) paintTicket(false); // name lands on the ticket live
            });
            el.addEventListener("change", () => (state[key] = el.value.trim()));
            return el;
          };
          bind("wName", "name", true);
          bind("wEmail", "email");
          bind("wPhone", "phone");
          bind("wCity", "city");
          bind("wGender", "gender");
          bind("wNotes", "notes");

          d.querySelector("#wBack").addEventListener("click", () => go(0));
          d.querySelector("#wNext").addEventListener("click", () => {
            for (const id of ["wName", "wEmail", "wPhone"]) {
              const el = d.querySelector("#" + id);
              if (!el.checkValidity()) {
                el.reportValidity();
                return;
              }
            }
            go(2);
          });
        } else {
          const c = cat();
          d.innerHTML =
            `<div class="rev-row"><span>Meals & sessions</span><b>Included, all three days</b></div>` +
            `<div class="rev-row"><span>Payment</span><b>Online now, or at the venue</b></div>` +
            `<div class="rev-row"><span>Total payable</span><b style="font-size:17px">${money(c.price)}</b></div>` +
            `<div class="wiz-nav"><button class="btn ghost" id="wBack2" type="button">← Details</button><button class="btn primary" id="wPay" type="button">Confirm &amp; Pay</button></div>`;
          d.querySelector("#wBack2").addEventListener("click", () => go(1));
          d.querySelector("#wPay").addEventListener("click", (e) => confirmAndPay(e.target));
        }
        stageEl.appendChild(d);
      }

      function go(n, retumTicket) {
        state.step = n;
        root.classList.toggle("at-ticket", n === 2);
        paintSteps();
        paintStage();
        paintTicket(retumTicket !== false);
        window.scrollTo({ top: 0, behavior: "smooth" });
      }

      async function confirmAndPay(btn) {
        const c = cat();
        // Nothing is posted while bookings are shut — the visitor gets the
        // same sentence here as on the home page, and the wizard stays exactly
        // as they left it so nothing they typed is lost.
        if (!(await ensureRegistrationsOpen())) return;
        btn.disabled = true;
        btn.textContent = "Confirming…";
        try {
          const record = await api("/api/registrations", {
            method: "POST",
            body: JSON.stringify({
              name: state.name,
              email: state.email,
              phone: state.phone,
              city: state.city,
              gender: state.gender,
              notes: state.notes,
              categoryId: c.id,
            }),
          });
          btn.textContent = "Opening payment…";
          // Open Razorpay checkout; showConfirmation runs after payment or dismissal.
          await openRazorpay(record, showConfirmation);
        } catch (err) {
          toast(err.message, "error");
          btn.disabled = false;
          btn.innerHTML = "Confirm &amp; Pay";
        }
      }

      (async () => {
        pageLoading(true);
        try {
          PRICING = await api("/api/pricing");
          // ?category= lands directly on the details step, ticket pre-stamped.
          const preset = new URLSearchParams(location.search).get("category");
          const presetIdx = PRICING.findIndex((c) => c.id === preset);
          if (presetIdx !== -1) {
            state.sel = presetIdx;
            go(1, true);
          } else {
            go(0, true);
          }
        } catch (err) {
          stageEl.innerHTML =
            '<div class="empty">Couldn\'t load the ticket categories — refresh the page and they\'ll show up.</div>';
          toast("couldn't load the ticket categories — refresh the page and they'll show up", "error");
        } finally {
          pageLoading(false);
        }
      })();

      function showConfirmation(r) {
        const ref = "BC-" + String(r.id || "").slice(0, 8).toUpperCase();
        const isPaid = !!r.paid;
        const layout = document.getElementById("reg-layout");
        layout.style.gridTemplateColumns = "1fr";
        // THE celebration — the mascot loses it completely, chatbot style:
        // victory jumps for a paid booking, a full dance while payment is
        // still pending, confetti raining through the card either way.
        layout.innerHTML = `
          <div class="card confetti-box" id="celebrateCard" style="max-width:560px;margin:0 auto;text-align:center">
            <div class="mascot-stage party" style="margin-top:4px">
              <span class="mascot-scale">${mascotHTML(isPaid ? "scene-jump" : "dance")}</span>
            </div>
            <h2 style="margin:0 0 6px">${isPaid ? "PAYMENT RECEIVED — LET'S GOOOO!!" : "LET'S GOOOO — you're in!!"}</h2>
            <p class="muted" style="margin:0 0 20px">
              ${isPaid
                ? escapeHtml(r.name) + ", your payment is confirmed and your spot is officially reserved. The mascot is doing laps around the inside of its button."
                : "You did it, " + escapeHtml(r.name) + "!! Your spot at the convention is saved and the mascot has not stopped dancing since."}
            </p>
            <div style="text-align:left;border:1px solid var(--border);border-radius:12px;padding:16px">
              <div class="bar-row" style="grid-template-columns:1fr auto;margin-bottom:8px">
                <span class="muted">Booking reference</span><b>${ref}</b>
              </div>
              <div class="bar-row" style="grid-template-columns:1fr auto;margin-bottom:8px">
                <span class="muted">Category</span><b>${escapeHtml(r.categoryName)}</b>
              </div>
              <div class="bar-row" style="grid-template-columns:1fr auto;margin-bottom:8px">
                <span class="muted">Amount</span><b>${money(r.amount)}</b>
              </div>
              <div class="bar-row" style="grid-template-columns:1fr auto;margin:0">
                <span class="muted">Payment status</span>
                <span class="pill ${isPaid ? "paid" : "pending"}">${isPaid ? "Paid ✓" : "Pending"}</span>
              </div>
            </div>
            ${r.ticketCode
              ? `<div class="tk-qr">
                   <img src="/api/ticket/${encodeURIComponent(r.ticketCode)}/qr.svg"
                        alt="Your ticket QR code" width="180" height="180" />
                   <div class="tk-qr-code">${escapeHtml(r.ticketCode)}</div>
                   <div class="tk-qr-note muted">Show this at the door, or keep a copy with the button below. The same code is in your email — and if the picture won't load, the ten characters work on their own.</div>
                 </div>`
              : ""}
            <p class="muted" style="font-size:13px;margin:16px 0 20px">
              ${isPaid
                ? "Your payment is in, safe and sound. The team will be in touch shortly — until then, the mascot is counting down the days right there with you."
                : "Pay online now or hand it to the team at the venue — dealer's choice. Just keep your booking reference close; that little code is your golden ticket."}
            </p>
            <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
              ${r.ticketCode ? '<button class="btn primary" type="button" id="dlTicket">\u2b07 Download ticket</button>' : ""}
              <button class="btn ghost" type="button" onclick="location.reload()">Register another</button>
              <a class="btn ghost" href="index.html">Back to home</a>
            </div>
          </div>`;

        // The ticket itself, as a PNG with the QR baked in — for the phone
        // that will be offline at the gate, and for the delegate who prints it.
        const dl = document.getElementById("dlTicket");
        if (dl)
          dl.addEventListener("click", async () => {
            const label = dl.innerHTML;
            dl.disabled = true;
            dl.textContent = "Drawing your ticket\u2026";
            try {
              await downloadTicket(r, state.sel);
              toast("Ticket saved \u2014 QR and all. Show it at the door.", "party");
            } catch (err) {
              toast(
                "Couldn't build the ticket image \u2014 the copy in your email carries the same QR.",
                "error"
              );
            } finally {
              dl.disabled = false;
              dl.innerHTML = label;
            }
          });
        // Confetti rain through the celebration card.
        const box = document.getElementById("celebrateCard");
        const colors = ["#5b5bf0", "#7c3aed", "#0ea5e9", "#10b981", "#f59e0b", "#ef4444"];
        for (let i = 0; i < 14; i++) {
          const p = document.createElement("i");
          p.style.left = (3 + Math.random() * 94) + "%";
          p.style.background = colors[i % colors.length];
          p.style.animationDelay = (Math.random() * 2.6).toFixed(2) + "s";
          p.style.animationDuration = (2.2 + Math.random() * 1.6).toFixed(2) + "s";
          box.appendChild(p);
        }
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    </script>
    <div class="footer">
      Bangalore Convention · A not-for-profit fellowship gathering · All funds go
      toward hosting the event.
    </div>

  </body>
</html>
