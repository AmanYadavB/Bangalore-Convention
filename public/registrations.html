<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrations · Bangalore Convention</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- L2 veil: EVERY page load starts covered from the first paint, so an
         empty layout is never visible - not on cold entry, not on reload,
         not when clicking between pages. It lifts when the page is ready
         (data pages hand it to html.data-wait until their fetches land),
         with a 350ms minimum so it never blinks and a 900ms cap so the veil
         itself never becomes the lag. The lift cues the entrance
         animations (see mountReveals). -->
    <script>
      (function () {
        var d = document.documentElement;
        d.classList.add("veiling");
        var lifted = false;
        var t0 = Date.now();
        window.__liftVeil = function () {
          if (lifted) return;
          lifted = true;
          var go = function () {
            // A page still fetching keeps the same cover (html.data-wait);
            // its pageLoading(false) will do the fade instead.
            if (d.classList.contains("data-wait") || window.__bcDataWait) {
              d.classList.remove("veiling");
              d.classList.add("data-wait");
              return;
            }
            d.classList.add("veil-up");
            document.dispatchEvent(new CustomEvent("bc:veil-up"));
            setTimeout(function () { d.classList.remove("veiling", "veil-up"); }, 460);
          };
          var hold = 350 - (Date.now() - t0);
          if (hold > 0) setTimeout(go, hold);
          else go();
        };
        setTimeout(window.__liftVeil, 900);
      })();
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="nav"></div>

    <div class="container">
      <div class="section-head">
        <div>
          <h1 class="page-title" style="margin-bottom: 2px">All Registrations</h1>
          <p class="page-sub" style="margin: 0" id="count-line"><span class="bc-load-mark" role="status" aria-label="Loading">B<i>·</i>I<i>·</i>A<i>·</i>A<i>·</i>C</span></p>
        </div>
      </div>

      <!-- One search box, ONE filter (status + categories combined), export. -->
      <div class="toolbar">
        <input id="search" placeholder="Search name, email, phone, city…" />
        <select id="filter">
          <option value="">All registrations</option>
          <option value="paid">Paid only</option>
          <option value="pending">Pending only</option>
        </select>
        <button class="btn small" id="export">Export CSV</button>
      </div>

      <!-- RG3 master–detail: person list left, detail panel right. On phones
           the detail opens as a frosted popup over the blurred page. -->
      <div class="reg-md">
        <div class="card reg-list" id="regList">
          <div class="bc-loading" role="status" aria-label="Loading"><span class="bc-load-mark">B<i>·</i>I<i>·</i>A<i>·</i>A<i>·</i>C</span></div>
        </div>
        <div class="reg-detail-wrap" id="detailWrap">
          <div class="card reg-detail" id="detailCard">
            <div class="empty">Pick a person to see their details.</div>
          </div>
        </div>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script>
      // No client-side gate: the Worker refuses to serve this page at all
      // without a session that has at least the staff role.
      mountNav("registrations");
      let ALL = [];

      function applyFilters() {
        const q = document.getElementById("search").value.trim().toLowerCase();
        const f = document.getElementById("filter").value;
        return ALL.filter((r) => {
          const matchesQ =
            !q ||
            [r.name, r.email, r.phone, r.city]
              .join(" ")
              .toLowerCase()
              .includes(q);
          const matchesF =
            !f ||
            (f === "paid"
              ? r.paid
              : f === "pending"
              ? !r.paid
              : r.categoryId === f.slice(4)); // "cat:<id>"
          return matchesQ && matchesF;
        });
      }

      let selId = null;
      const wrap = document.getElementById("detailWrap");

      function selected() {
        return ALL.find((r) => r.id === selId) || null;
      }

      function paintDetail(retum) {
        const card = document.getElementById("detailCard");
        const r = selected();
        if (!r) {
          card.innerHTML = '<div class="empty">Pick a person to see their details.</div>';
          return;
        }
        card.innerHTML =
          `<button class="reg-detail-x" id="detailClose" type="button" aria-label="Close">✕</button>` +
          `<button class="reg-detail-copy" data-copy="${r.id}" type="button"
                   aria-label="Copy details" title="Copy details">⧉</button>` +
          `<div style="display:flex;align-items:center;gap:11px;margin-bottom:10px">
            <span class="reg-avat" style="width:42px;height:42px;font-size:16px">${escapeHtml(
              (r.name || "?").charAt(0).toUpperCase()
            )}</span>
            <div><b style="font-size:16px">${escapeHtml(r.name)}</b><br>
            <span class="muted" style="font-size:12px">registered ${formatDate(r.createdAt)}</span></div>
          </div>` +
          `<div class="reg-drow"><span class="muted">Email</span><span><b>${escapeHtml(r.email)}</b></span></div>` +
          `<div class="reg-drow"><span class="muted">Phone</span><span><b>${escapeHtml(r.phone)}</b></span></div>` +
          `<div class="reg-drow"><span class="muted">City</span><span>${escapeHtml(r.city) || "—"}</span></div>` +
          `<div class="reg-drow"><span class="muted">Gender</span><span>${escapeHtml(r.gender) || "—"}</span></div>` +
          `<div class="reg-drow"><span class="muted">Category</span><span><b>${escapeHtml(r.categoryName)}</b></span></div>` +
          `<div class="reg-drow"><span class="muted">Amount</span><span><b style="font-size:15px">${money(r.amount)}</b></span></div>` +
          `<div class="reg-drow"><span class="muted">Status</span><span><span class="pill ${
            r.paid ? "paid" : "pending"
          }">${r.paid ? "Paid" : "Pending"}</span></span></div>` +
          (r.notes
            ? `<div class="reg-drow"><span class="muted">Notes</span><span>${escapeHtml(r.notes)}</span></div>`
            : "") +
          `<div class="reg-actions">
            <button class="btn danger" data-del="${r.id}">Delete</button>
          </div>`;
        if (retum) {
          card.classList.remove("retum");
          void card.offsetWidth;
          card.classList.add("retum");
        }
        const x = document.getElementById("detailClose");
        if (x) x.addEventListener("click", () => wrap.classList.remove("open"));
      }

      function render() {
        const rows = applyFilters().sort(
          (a, b) => new Date(b.createdAt) - new Date(a.createdAt)
        );
        document.getElementById("count-line").textContent =
          `${ALL.length} total · ${ALL.filter((r) => r.paid).length} paid · showing ${rows.length}`;

        const list = document.getElementById("regList");
        if (!rows.length) {
          list.innerHTML = '<div class="empty">No registrations found.</div>';
          selId = null;
          paintDetail(false);
          return;
        }
        // Keep the selection if it survived the filters; else pick the top row.
        if (!rows.some((r) => r.id === selId)) selId = rows[0].id;

        list.innerHTML = rows
          .map(
            (r) => `
          <button class="mrow${r.id === selId ? " on" : ""}" data-id="${r.id}" type="button">
            <span class="reg-avat">${escapeHtml((r.name || "?").charAt(0).toUpperCase())}</span>
            <span style="min-width:0">
              <span class="m-nm">${escapeHtml(r.name)}</span><br>
              <span class="m-sub">${escapeHtml(r.categoryName)} · ${money(r.amount)}</span>
            </span>
            <span class="m-chip pill ${r.paid ? "paid" : "pending"}">${r.paid ? "✓" : "…"}</span>
          </button>`
          )
          .join("");
        paintDetail(false);
      }

      async function load() {
        ALL = await api("/api/registrations");
        const pricing = await api("/api/pricing");
        // Categories join the single filter under a separator row.
        document.getElementById("filter").innerHTML =
          '<option value="">All registrations</option>' +
          '<option value="paid">Paid only</option>' +
          '<option value="pending">Pending only</option>' +
          '<option value="" disabled>── categories ──</option>' +
          pricing.map((c) => `<option value="cat:${c.id}">${escapeHtml(c.name)}</option>`).join("");
        render();
      }

      document.getElementById("search").addEventListener("input", render);
      document.getElementById("filter").addEventListener("change", render);

      // Selecting a person: paint the panel; on phones it opens as the
      // frosted popup (the .open class only has an effect ≤700px).
      document.getElementById("regList").addEventListener("click", (e) => {
        const row = e.target.closest(".mrow");
        if (!row) return;
        selId = row.getAttribute("data-id");
        document.querySelectorAll(".mrow").forEach((m) =>
          m.classList.toggle("on", m.getAttribute("data-id") === selId)
        );
        paintDetail(true);
        wrap.classList.add("open");
      });

      // Frost tap (not the card) and Escape close the mobile popup.
      wrap.addEventListener("click", (e) => {
        if (e.target === wrap) wrap.classList.remove("open");
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") wrap.classList.remove("open");
      });

      document.getElementById("detailCard").addEventListener("click", async (e) => {
        const del = e.target.closest("[data-del]");
        const copy = e.target.closest("[data-copy]");
        try {
          // Paid/unpaid is not a switch anyone gets to flip: a registration is
          // paid because Razorpay said so, and nothing else. The status below
          // is a readout, not a control.
          if (copy) {
            const r = ALL.find((x) => x.id === copy.getAttribute("data-copy"));
            if (!r) return;
            const text = [
              r.name,
              r.email,
              r.phone,
              r.city,
              `${r.categoryName} — ${money(r.amount)}`,
              r.paid ? "Paid" : "Pending",
            ]
              .filter(Boolean)
              .join("\n");
            await navigator.clipboard.writeText(text);
            toast("details copied — paste away");
          } else if (del) {
            const id = del.getAttribute("data-del");
            if (!(await mascotConfirm({
              mood: "sad",
              danger: true,
              title: "Delete this registration?",
              message: "Their booking vanishes from the list and the totals, and there's no undo — the mascot checked. Twice.",
              confirmText: "Delete it",
              cancelText: "Keep them in",
            }))) return;
            await api(`/api/registrations/${id}`, { method: "DELETE" });
            ALL = ALL.filter((r) => r.id !== id);
            selId = null;
            wrap.classList.remove("open");
            render();
            toast("registration deleted — the mascot needs a minute");
          }
        } catch (err) {
          toast(err.message, "error");
        }
      });

      document.getElementById("export").addEventListener("click", () => {
        const rows = applyFilters();
        if (!rows.length) return toast("nothing to export — the list is empty. add or unfilter some registrations first", "error");
        // Excel and Sheets execute any cell beginning with = + - @ (or a
        // leading tab/CR) as a formula. A registrant can put anything in the
        // notes field, so prefix those with an apostrophe to neutralise them.
        const csvCell = (v) => {
          let s = String(v === null || v === undefined ? "" : v);
          if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
          return `"${s.replace(/"/g, '""')}"`;
        };
        const header = ["Name", "Email", "Phone", "City", "Gender", "Category", "Amount", "Paid", "Registered", "Notes"];
        const csv = [header.join(",")]
          .concat(
            rows.map((r) =>
              [r.name, r.email, r.phone, r.city, r.gender, r.categoryName, r.amount, r.paid ? "Yes" : "No", r.createdAt, r.notes]
                .map(csvCell)
                .join(",")
            )
          )
          .join("\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = "registrations.csv";
        a.click();
        URL.revokeObjectURL(a.href);
      });

      pageLoading(true);
      load()
        .catch((e) => toast(e.message, "error"))
        .finally(() => pageLoading(false));
    </script>
  </body>
</html>
