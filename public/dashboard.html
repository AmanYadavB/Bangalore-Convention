<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · Bangalore Convention</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .dash-2col {
        grid-template-columns: 300px 1fr;
      }
      .donut {
        position: relative;
        width: 160px;
        margin: 6px auto 14px;
      }
      .donut-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }
      .donut-center span {
        font-size: 12px;
      }
      .donut-center b {
        font-size: 18px;
      }
      .legend {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 14px;
      }
      .legend-row .dot {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        flex: none;
      }
      .legend-row b {
        margin-left: auto;
      }
      @media (max-width: 720px) {
        .dash-2col {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="nav"></div>

    <div class="container">
      <h1 class="page-title">Funds &amp; Expenses Dashboard</h1>
      <p class="page-sub">Live view of money collected and spent for the convention.</p>

      <!-- Top stats -->
      <div class="grid cols-4" id="stats">
        <div class="empty">Loading…</div>
      </div>

      <!-- Chart + collections -->
      <div class="grid dash-2col" style="margin-top: 22px; align-items: start; gap: 18px">
        <div class="card">
          <h3 style="margin-top: 0">Funds Overview</h3>
          <div id="funds-chart"><div class="muted">Loading…</div></div>
        </div>
        <div class="card">
          <h3 style="margin-top: 0">Collections by Category</h3>
          <div id="by-category"><div class="muted">Loading…</div></div>
        </div>
      </div>

      <!-- Expenses breakdown -->
      <div class="card" style="margin-top: 18px">
        <div class="section-head" style="margin: 0 0 12px">
          <h3 style="margin: 0">Expenses by Category</h3>
          <a class="btn small" href="expenses.html">Manage Expenses</a>
        </div>
        <div id="exp-category"><div class="muted">Loading…</div></div>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script>
      mountNav("dashboard");

      if (ensureAdmin()) {
        function statCard(label, value, cls) {
          return `<div class="card stat">
            <div class="label">${label}</div>
            <div class="value ${cls || ""}">${value}</div>
          </div>`;
        }

        function bars(items, valueKey, max, cls) {
          if (!items.length) return '<div class="muted">No data yet.</div>';
          return items
            .map((it) => {
              const val = it[valueKey] || 0;
              const pct = max ? Math.round((val / max) * 100) : 0;
              return `<div class="bar-row">
                <div>${escapeHtml(it.name)}${it.count != null ? ` <span class="muted">(${it.count})</span>` : ""}</div>
                <div class="bar-track"><div class="bar-fill ${cls || ""}" style="width:${pct}%"></div></div>
                <div><b>${money(val)}</b></div>
              </div>`;
            })
            .join("");
        }

        function donut(segments) {
          const total = segments.reduce((s, x) => s + Math.max(0, x.value), 0);
          const r = 62;
          const c = 2 * Math.PI * r;
          let offset = 0;
          const arcs = total
            ? segments
                .map((seg) => {
                  const val = Math.max(0, seg.value);
                  const dash = (val / total) * c;
                  const arc = `<circle r="${r}" cx="80" cy="80" fill="none" stroke-width="22"
                    style="stroke:${seg.color}" stroke-dasharray="${dash} ${c - dash}"
                    stroke-dashoffset="${-offset}" transform="rotate(-90 80 80)"></circle>`;
                  offset += dash;
                  return arc;
                })
                .join("")
            : "";
          return `<svg viewBox="0 0 160 160" width="160" height="160">
              <circle r="${r}" cx="80" cy="80" fill="none" stroke-width="22" style="stroke:var(--bg-2)"></circle>
              ${arcs}
            </svg>`;
        }

        function legend(items) {
          return (
            `<div class="legend">` +
            items
              .map(
                (i) =>
                  `<div class="legend-row"><span class="dot" style="background:${i.color}"></span>
                    <span>${i.label}</span><b>${money(i.value)}</b></div>`
              )
              .join("") +
            `</div>`
          );
        }

        async function loadDashboard() {
          const d = await api("/api/dashboard");

          document.getElementById("stats").innerHTML =
            statCard("Registrations", `${d.registrationCount}`, "accent") +
            statCard("Collected", money(d.totalCollected), "green") +
            statCard("Pending", money(d.totalPending), "amber") +
            statCard("Total Expenses", money(d.totalExpenses), "red") +
            statCard("Available Balance", money(d.balance), d.balance >= 0 ? "green" : "red") +
            statCard("Total Pledged", money(d.totalPledged)) +
            statCard("Paid Count", `${d.paidCount} / ${d.registrationCount}`) +
            statCard("Avg / Head", money(d.registrationCount ? Math.round(d.totalPledged / d.registrationCount) : 0));

          const segs = [
            { label: "Collected", value: d.totalCollected, color: "var(--green)" },
            { label: "Pending", value: d.totalPending, color: "var(--amber)" },
            { label: "Expenses", value: d.totalExpenses, color: "var(--red)" },
          ];
          document.getElementById("funds-chart").innerHTML = `
            <div class="donut">
              ${donut(segs)}
              <div class="donut-center">
                <span class="muted">Balance</span>
                <b style="color:${d.balance >= 0 ? "var(--green)" : "var(--red)"}">${money(d.balance)}</b>
              </div>
            </div>
            ${legend(segs)}`;

          const maxCat = Math.max(1, ...d.byCategory.map((c) => c.amount));
          document.getElementById("by-category").innerHTML = bars(d.byCategory, "amount", maxCat, "green");

          const maxExp = Math.max(1, ...d.expenseByCategory.map((c) => c.amount));
          document.getElementById("exp-category").innerHTML = d.expenseByCategory.length
            ? bars(d.expenseByCategory, "amount", maxExp, "amber")
            : '<div class="muted">No expenses recorded yet.</div>';
        }

        loadDashboard().catch((e) => toast(e.message, "error"));
      }
    </script>
  </body>
</html>
