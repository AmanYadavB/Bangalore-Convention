<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · Bangalore Convention</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div id="nav"></div>

    <div class="container">
      <h1 class="page-title">Funds & Expenses Dashboard</h1>
      <p class="page-sub">Live view of money collected and spent for the convention.</p>

      <!-- Top stats -->
      <div class="grid cols-4" id="stats">
        <div class="empty">Loading…</div>
      </div>

      <!-- Breakdown -->
      <div class="grid" style="grid-template-columns: 1fr 1fr; margin-top: 22px; align-items: start">
        <div class="card">
          <h3 style="margin-top: 0">Collections by Category</h3>
          <div id="by-category"><div class="muted">Loading…</div></div>
        </div>
        <div class="card">
          <h3 style="margin-top: 0">Expenses by Category</h3>
          <div id="exp-category"><div class="muted">Loading…</div></div>
        </div>
      </div>

      <!-- Add expense -->
      <div class="section-head">
        <h2>Expenses</h2>
      </div>
      <div class="card">
        <form id="exp-form">
          <div class="form-grid">
            <divclass="field">
              <label for="title">Expense Title *</label>
              <input id="title" name="title" required placeholder="e.g. Hall booking" />
            </div>
            <div class="field">
              <label for="category">Category</label>
              <select id="category" name="category">
                <option>Venue</option>
                <option>Food & Catering</option>
                <option>Accommodation</option>
                <option>Printing & Stationery</option>
                <option>Sound & Stage</option>
                <option>Transport</option>
                <option>Miscellaneous</option>
              </select>
            </div>
            <div class="field">
              <label for="amount">Amount (₹) *</label>
              <input id="amount" name="amount" type="number" min="1" step="1" required placeholder="0" />
            </div>
            <div class="field">
              <label for="date">Date</label>
              <input id="date" name="date" type="date" />
            </div>
            <div class="field full">
              <label for="notes">Notes</label>
              <input id="notes" name="notes" placeholder="Optional details / vendor" />
            </div>
          </div>
          <div class="form-footer">
            <span class="muted">Expenses reduce the available balance.</span>
            <button class="btn primary" type="submit">Add Expense</button>
          </div>
        </form>
      </div>

      <div class="table-wrap" style="margin-top: 18px">
        <table>
          <thead>
            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Amount</th>
              <th>Date</th>
              <th>Notes</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="exp-rows">
            <tr><td colspan="6" class="empty">Loading…</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script>
      mountNav("dashboard");

      function statCard(label, value, cls) {
        return `<div class="card stat">
          <div class="label">${label}</div>
          <div class="value ${cls || ""}">${value}</div>
        </div>`;
      }

      function bars(items, valueKey, max, cls) {
        if (!items.length) return '<div class="muted">No data yet.</div>';
        return items
          .map((it) => {
            const val = it[valueKey] || 0;
            const pct = max ? Math.round((val / max) * 100) : 0;
            return `<div class="bar-row">
              <div>${escapeHtml(it.name)}${it.count != null ? ` <span class="muted">(${it.count})</span>` : ""}</div>
              <div class="bar-track"><div class="bar-fill ${cls || ""}" style="width:${pct}%"></div></div>
              <div><b>${money(val)}</b></div>
            </div>`;
          })
          .join("");
      }

      async function loadDashboard() {
        const d = await api("/api/dashboard");

        document.getElementById("stats").innerHTML =
          statCard("Registrations", `${d.registrationCount}`, "accent") +
          statCard("Collected", money(d.totalCollected), "green") +
          statCard("Pending", money(d.totalPending), "amber") +
          statCard("Total Expenses", money(d.totalExpenses), "red") +
          statCard("Available Balance", money(d.balance), d.balance >= 0 ? "green" : "red") +
          statCard("Total Pledged", money(d.totalPledged)) +
          statCard("Paid Count", `${d.paidCount} / ${d.registrationCount}`) +
          statCard("Avg / Head", money(d.registrationCount ? Math.round(d.totalPledged / d.registrationCount) : 0));

        const maxCat = Math.max(1, ...d.byCategory.map((c) => c.amount));
        document.getElementById("by-category").innerHTML = bars(d.byCategory, "amount", maxCat, "green");

        const maxExp = Math.max(1, ...d.expenseByCategory.map((c) => c.amount));
        document.getElementById("exp-category").innerHTML = d.expenseByCategory.length
          ? bars(d.expenseByCategory, "amount", maxExp, "amber")
          : '<div class="muted">No expenses recorded yet.</div>';
      }

      async function loadExpenses() {
        const list = (await api("/api/expenses")).sort(
          (a, b) => new Date(b.date) - new Date(a.date)
        );
        const tbody = document.getElementById("exp-rows");
        if (!list.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="empty">No expenses yet. Add your first one above.</td></tr>';
          return;
        }
        tbody.innerHTML = list
          .map(
            (e) => `<tr>
              <td><b>${escapeHtml(e.title)}</b></td>
              <td>${escapeHtml(e.category)}</td>
              <td>${money(e.amount)}</td>
              <td class="muted">${formatDate(e.date)}</td>
              <td class="muted">${escapeHtml(e.notes) || "—"}</td>
              <td><button class="btn danger" data-del="${e.id}">Delete</button></td>
            </tr>`
          )
          .join("");
      }

      async function refresh() {
        await Promise.all([loadDashboard(), loadExpenses()]);
      }

      document.getElementById("exp-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const form = e.target;
        const payload = Object.fromEntries(new FormData(form).entries());
        try {
          await api("/api/expenses", { method: "POST", body: JSON.stringify(payload) });
          toast("Expense added");
          form.reset();
          refresh();
        } catch (err) {
          toast(err.message, "error");
        }
      });

      document.getElementById("exp-rows").addEventListener("click", async (e) => {
        const del = e.target.closest("[data-del]");
        if (!del) return;
        if (!confirm("Delete this expense?")) return;
        try {
          await api(`/api/expenses/${del.getAttribute("data-del")}`, { method: "DELETE" });
          toast("Expense deleted");
          refresh();
        } catch (err) {
          toast(err.message, "error");
        }
      });

      refresh().catch((e) => toast(e.message, "error"));
    </script>
  </body>
</html>
