<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · Bangalore Convention</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- L2 veil: cover the very first paint so nothing half-drawn ever shows.
         Cold entries and reloads only - in-site navigation skips it. The
         lift cues the page's entrance animations (see mountReveals). -->
    <script>
      (function () {
        try {
          var nav = performance.getEntriesByType("navigation")[0];
          var reload = nav && nav.type === "reload";
          if (!reload && sessionStorage.getItem("bcVeil")) return;
          sessionStorage.setItem("bcVeil", "1");
        } catch (e) {}
        var d = document.documentElement;
        d.classList.add("veiling");
        var lifted = false;
        window.__liftVeil = function () {
          if (lifted) return;
          lifted = true;
          // A page still fetching keeps the same cover (html.data-wait);
          // its pageLoading(false) will do the fade instead.
          if (d.classList.contains("data-wait") || window.__bcDataWait) {
            d.classList.remove("veiling");
            d.classList.add("data-wait");
            return;
          }
          d.classList.add("veil-up");
          document.dispatchEvent(new CustomEvent("bc:veil-up"));
          setTimeout(function () { d.classList.remove("veiling", "veil-up"); }, 460);
        };
        // Hard cap: the veil may never itself become the lag.
        setTimeout(window.__liftVeil, 900);
      })();
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      .dash-2col {
        grid-template-columns: 300px 1fr;
      }
      .donut {
        position: relative;
        width: 160px;
        margin: 6px auto 14px;
      }
      .donut-center {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }
      .donut-center span {
        font-size: 12px;
      }
      .donut-center b {
        font-size: 18px;
      }
      .legend {
        display: flex;
        flex-direction: column;
        gap: 9px;
      }
      .legend-row {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 14px;
      }
      .legend-row .dot {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        flex: none;
      }
      .legend-row b {
        margin-left: auto;
      }
      @media (max-width: 720px) {
        .dash-2col {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="nav"></div>

    <div class="container">
      <h1 class="page-title">Funds &amp; Expenses Dashboard</h1>
      <p class="page-sub">Live view of money collected and spent for the convention.</p>

      <!-- DB1 bento board: the money story in one grid — hero collected tile
           with progress + trend, stat tiles, category bars, activity feed. -->
      <div class="bento" id="bento">
        <div class="bc-loading" role="status" aria-label="Loading" style="grid-column: 1 / -1"><span class="bc-load-mark">B<i>·</i>I<i>·</i>A<i>·</i>A<i>·</i>C</span></div>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script>
      // No client-side gate: the Worker refuses to serve this page at all
      // without a session that has at least the staff role.
      mountNav("dashboard");

      {
        function bars(items, valueKey, max, cls) {
          if (!items.length) return '<div class="muted">No data yet.</div>';
          return items
            .map((it) => {
              const val = it[valueKey] || 0;
              const pct = max ? Math.round((val / max) * 100) : 0;
              return `<div class="bar-row">
                <div>${escapeHtml(it.name)}${it.count != null ? ` <span class="muted">(${it.count})</span>` : ""}</div>
                <div class="bar-track"><div class="bar-fill ${cls || ""}" style="width:${pct}%"></div></div>
                <div><b>${money(val)}</b></div>
              </div>`;
            })
            .join("");
        }

        // Cumulative collected-per-day over the last 30 days, as a sparkline.
        function sparkline(regs) {
          const paid = regs
            .filter((r) => r.paid)
            .sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
          if (paid.length < 2) return "";
          const cutoff = Date.now() - 30 * 864e5;
          let base = 0;
          const pts = [];
          let running = 0;
          for (const r of paid) {
            const t = new Date(r.createdAt).getTime();
            running += r.amount;
            if (t < cutoff) base = running;
            else pts.push([t, running]);
          }
          if (pts.length < 2) return "";
          const t0 = pts[0][0], t1 = pts[pts.length - 1][0] || t0 + 1;
          const v0 = base, v1 = pts[pts.length - 1][1];
          const X = (t) => (200 * (t - t0)) / Math.max(1, t1 - t0);
          const Y = (v) => 42 - (38 * (v - v0)) / Math.max(1, v1 - v0);
          const line = pts.map(([t, v]) => `${X(t).toFixed(1)},${Y(v).toFixed(1)}`).join(" ");
          const last = pts[pts.length - 1];
          return `<svg class="dash-spark" viewBox="0 0 200 46" width="100%" height="46" preserveAspectRatio="none" aria-hidden="true">
            <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" points="${line}"/>
            <circle cx="${X(last[0]).toFixed(1)}" cy="${Y(last[1]).toFixed(1)}" r="3.5" fill="var(--accent)"/>
          </svg>`;
        }

        function tile(label, value, valueCls, sub, subCls) {
          return `<div class="card stat">
            <div class="label">${label}</div>
            <div class="value ${valueCls || ""}">${value}</div>
            ${sub ? `<div class="b-sub ${subCls || "mut"}">${sub}</div>` : ""}
          </div>`;
        }

        async function loadDashboard() {
          // Registrations feed the sparkline + activity feed; the dashboard
          // still paints fully from the aggregates if that call fails.
          const [d, regs] = await Promise.all([
            api("/api/dashboard"),
            api("/api/registrations").catch(() => []),
          ]);

          // The organisers expect 500–600 attendees; progress is measured
          // against that estimate, not against "pledged" money (which was
          // just the sum of whoever had registered so far).
          const EXPECTED_REGISTRATIONS = 550;
          const pct = Math.min(
            100,
            Math.round((d.registrationCount / EXPECTED_REGISTRATIONS) * 100)
          );
          const pendingCount = d.registrationCount - d.paidCount;

          const hero = `<div class="card stat dash-hero">
            <div class="label">Collected</div>
            <div class="big">${money(d.totalCollected)}</div>
            <div class="goal-line">${d.registrationCount} of ~${EXPECTED_REGISTRATIONS} expected registrations (${pct}%)</div>
            <div class="goal-track"><i style="width:${pct}%"></i></div>
            ${sparkline(regs)}
          </div>`;

          const tiles =
            tile("Available Balance", money(d.balance), d.balance >= 0 ? "green" : "red") +
            tile("Total Expenses", money(d.totalExpenses), "red") +
            tile("Registrations", d.registrationCount, "accent", `${d.paidCount} paid`, "green") +
            tile("Pending", money(d.totalPending), "amber", `${pendingCount} awaiting payment`, "amber");

          const maxCat = Math.max(1, ...d.byCategory.map((c) => c.amount));
          const catCard = `<div class="card b-wide">
            <div class="section-head" style="margin:0 0 10px"><h3 style="margin:0;font-size:15px">Collections by Category</h3></div>
            ${bars(d.byCategory, "amount", maxCat, "green")}
          </div>`;

          const maxExp = Math.max(1, ...d.expenseByCategory.map((c) => c.amount));
          const expCard = `<div class="card b-wide">
            <div class="section-head" style="margin:0 0 10px">
              <h3 style="margin:0;font-size:15px">Expenses by Category</h3>
              <a class="btn small" href="expenses.html">Manage Expenses</a>
            </div>
            ${d.expenseByCategory.length ? bars(d.expenseByCategory, "amount", maxExp, "amber") : '<div class="muted">No expenses recorded yet.</div>'}
          </div>`;

          const recent = [...regs]
            .sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))
            .slice(0, 6);
          const feedCard = `<div class="card b-wide">
            <div class="section-head" style="margin:0 0 6px">
              <h3 style="margin:0;font-size:15px">Latest Registrations</h3>
              <a class="btn small" href="registrations.html">See all</a>
            </div>
            ${
              recent.length
                ? recent
                    .map(
                      (r) => `<div class="feed-row">
                        <span class="feed-ic">🎟️</span>
                        <span><b>${escapeHtml(r.name)}</b> · ${escapeHtml(r.categoryName)}</span>
                        <span class="feed-amt" style="color:${r.paid ? "var(--green)" : "var(--amber)"}">${money(r.amount)}</span>
                      </div>`
                    )
                    .join("")
                : '<div class="muted">No registrations yet.</div>'
            }
          </div>`;

          document.getElementById("bento").innerHTML = hero + tiles + catCard + feedCard + expCard;
        }

        pageLoading(true);
        loadDashboard()
          .catch((e) => toast(e.message, "error"))
          .finally(() => pageLoading(false));
      }
    </script>
  </body>
</html>
