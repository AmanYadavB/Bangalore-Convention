<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenses · Bangalore Convention</title>
    <link rel="stylesheet" href="css/style.css" />
    <!-- L2 veil: cover the very first paint so nothing half-drawn ever shows.
         Cold entries and reloads only - in-site navigation skips it. The
         lift cues the page's entrance animations (see mountReveals). -->
    <script>
      (function () {
        try {
          var nav = performance.getEntriesByType("navigation")[0];
          var reload = nav && nav.type === "reload";
          if (!reload && sessionStorage.getItem("bcVeil")) return;
          sessionStorage.setItem("bcVeil", "1");
        } catch (e) {}
        var d = document.documentElement;
        d.classList.add("veiling");
        var lifted = false;
        window.__liftVeil = function () {
          if (lifted) return;
          lifted = true;
          d.classList.add("veil-up");
          document.dispatchEvent(new CustomEvent("bc:veil-up"));
          setTimeout(function () { d.classList.remove("veiling", "veil-up"); }, 460);
        };
        // Hard cap: the veil may never itself become the lag.
        setTimeout(window.__liftVeil, 900);
      })();
    </script>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="nav"></div>

    <div class="container">
      <h1 class="page-title">Expenses</h1>
      <p class="page-sub">Record and track every rupee spent for the convention.</p>

      <!-- EX1 quick-add ledger: running total, a one-line add bar (date &
           notes tucked behind ＋), and slim ledger rows below. -->
      <div class="exp-head">
        <span><span class="muted" style="font-size: 12.5px">Total spent</span><br>
          <b class="exp-total" id="expTotal">₹0</b></span>
        <span class="exp-substats muted" id="expSub"><span class="bc-load-mark" role="status" aria-label="Loading">B<i>·</i>I<i>·</i>A<i>·</i>A<i>·</i>C</span></span>
      </div>

      <form class="exp-qadd" id="exp-form">
        <input id="title" name="title" class="q-title" required placeholder="What did we pay for?" autocomplete="off" />
        <select id="category" name="category">
          <option>Venue</option>
          <option>Food &amp; Catering</option>
          <option>Accommodation</option>
          <option>Printing &amp; Stationery</option>
          <option>Sound &amp; Stage</option>
          <option>Transport</option>
          <option>Miscellaneous</option>
        </select>
        <input id="amount" name="amount" class="q-amt" type="number" min="1" step="1" required placeholder="₹ 0" />
        <button class="btn primary small" type="submit">Add</button>
        <button class="q-more" id="qMore" type="button" title="Add a date or note" aria-expanded="false">＋</button>
        <div class="q-extra" id="qExtra" hidden>
          <input id="date" name="date" type="date" title="Date (defaults to today)" />
          <input id="notes" name="notes" placeholder="Notes / vendor (optional)" />
        </div>
      </form>

      <div class="exp-ledger" id="expLedger">
        <div class="bc-loading" role="status" aria-label="Loading"><span class="bc-load-mark">B<i>·</i>I<i>·</i>A<i>·</i>A<i>·</i>C</span></div>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script>
      // No client-side gate: the Worker refuses to serve this page at all
      // without a session that has at least the staff role.
      mountNav("expenses");

      {
        let firstPaint = true;

        async function loadExpenses() {
          const list = (await api("/api/expenses")).sort(
            (a, b) => new Date(b.date) - new Date(a.date)
          );

          const total = list.reduce((s, e) => s + (e.amount || 0), 0);
          const weekAgo = Date.now() - 7 * 864e5;
          const thisWeek = list
            .filter((e) => new Date(e.date).getTime() >= weekAgo)
            .reduce((s, e) => s + (e.amount || 0), 0);
          document.getElementById("expTotal").textContent = money(total);
          document.getElementById("expSub").innerHTML =
            `${list.length} ${list.length === 1 ? "entry" : "entries"} · ${money(thisWeek)} this week`;

          const ledger = document.getElementById("expLedger");
          if (!list.length) {
            ledger.innerHTML = '<div class="empty">No expenses yet. Add your first one above.</div>';
            return;
          }
          ledger.classList.toggle("pop", firstPaint);
          ledger.innerHTML = list
            .map(
              (e, i) => `<div class="exp-row" style="--i:${Math.min(i, 10)}">
                <span class="exp-main"><b>${escapeHtml(e.title)}</b>${
                  e.notes ? `<small>${escapeHtml(e.notes)}</small>` : ""
                }</span>
                <span class="exp-meta">
                  <span class="cat-chip">${escapeHtml(e.category)}</span>
                  <span class="exp-date muted">${formatDate(e.date)}</span>
                  <button class="btn danger small exp-del" data-del="${e.id}" type="button">Delete</button>
                </span>
                <span class="exp-amt">−${money(e.amount)}</span>
              </div>`
            )
            .join("");
          firstPaint = false;
        }

        // ＋ tucks the optional date & notes behind the one-line bar.
        const qMore = document.getElementById("qMore");
        const qExtra = document.getElementById("qExtra");
        qMore.addEventListener("click", () => {
          qExtra.hidden = !qExtra.hidden;
          qMore.classList.toggle("on", !qExtra.hidden);
          qMore.setAttribute("aria-expanded", qExtra.hidden ? "false" : "true");
        });

        document.getElementById("exp-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const form = e.target;
          const payload = Object.fromEntries(new FormData(form).entries());
          try {
            await api("/api/expenses", { method: "POST", body: JSON.stringify(payload) });
            toast("expense added — the mascot is guarding the receipt with its life");
            form.reset();
            qExtra.hidden = true;
            qMore.classList.remove("on");
            loadExpenses();
          } catch (err) {
            toast(err.message, "error");
          }
        });

        document.getElementById("expLedger").addEventListener("click", async (e) => {
          const del = e.target.closest("[data-del]");
          if (!del) return;
          if (!(await mascotConfirm({
            mood: "sad",
            danger: true,
            title: "Delete this expense?",
            message: "It comes off the totals right away. The mascot is already hugging the receipt goodbye.",
            confirmText: "Delete it",
            cancelText: "Keep the receipt",
          }))) return;
          try {
            await api(`/api/expenses/${del.getAttribute("data-del")}`, { method: "DELETE" });
            toast("expense deleted — the mascot allowed itself exactly one tear");
            loadExpenses();
          } catch (err) {
            toast(err.message, "error");
          }
        });

        loadExpenses().catch((e) => toast(e.message, "error"));
      }
    </script>
  </body>
</html>
